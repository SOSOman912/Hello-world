<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4efe6;
        color: #1c1915;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      p {
        margin-top: 1rem;
        font-family: system-ui, sans-serif;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b645b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>A static HTML page</p>
    </main>
  </body>
</html>
